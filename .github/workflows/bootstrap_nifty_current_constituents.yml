name: Bootstrap Nifty current constituents

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap_nifty_current_constituents.yml"
      - "scripts/download_nifty_constituents.py"

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install downloader dependencies
        run: python -m pip install --upgrade requests

      - name: Download official CSVs with browser User-Agent
        run: python scripts/download_nifty_constituents.py

      - name: Commit downloaded snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nifty_index_history/current
          git diff --cached --quiet && exit 0
          git commit -m "Download current Nifty constituent snapshots"
          git push
