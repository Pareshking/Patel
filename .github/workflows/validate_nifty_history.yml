name: Validate maximum Nifty history

on:
  pull_request:
    paths:
      - 'data/nifty_index_history/max_history/**'
      - 'scripts/audit_max_nifty_history.py'
      - 'scripts/build_effective_nifty_history.py'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild latest half-year backward from official anchor
        run: python scripts/build_effective_nifty_history.py
      - name: Audit Nifty history layer
        run: python scripts/audit_max_nifty_history.py
